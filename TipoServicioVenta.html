<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tipo de Servicio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="TipoServicio">
  <div class="pantalla">
    
    <!-- Encabezado con marcas -->
    <header class="header-marcas">
      <img src="img/logExPlus.png" class="logo-img logo-ex-plus" alt="Excelencia plus">
      <img src="img/logExcelencia.png" class="logo-img" alt="Excelencia">
      <img src="img/logZinabus.png" class="logo-img" alt="Zina-bus">
    </header>

    <h1 class="titulo-pantalla">VENTA DE<br><span>BOLETOS</span></h1>
    
    <div class="linea-decorativa"></div>

    <!-- Contenido Principal -->
    <main class="ts-contenedor-principal">
      <div class="ts-bloque-botones">
        <button class="ts-btn-magenta" onclick="window.location.href='bienvenidaDirecto.html'">
    SERVICIO DIRECTO
</button>
        <button class="ts-btn-magenta" onclick="window.location.href='BienvenidaOrdinario.html'">
    SERVICIO ORDINARIO
</button>
      </div>

      <div class="ts-ilustracion-boletos">
        <img src="img/VentaBoletos.png" alt="Boletos">
      </div>
    </main>

    <!-- Pie de página con QR -->
    <footer class="pie-kiosk">
      <div class="pie-col-izquierda">
        <div class="qr-box">
          <img src="img/QR.png" alt="QR Code">
        </div>
        <div class="redes">
         <img class="icono-facebook" src="img/logoface.png" alt="Facebook">
          <span>AutotransportesZinabus</span>
        </div>
      </div>

      <div class="pie-col-derecha">
        <div class="contacto">
          <div class="atencion-titulo">Atención a clientes</div>
          <div class="telef">800 00 94 622</div>
        </div>
        <div class="sitio">www.autobuseszinacantepec.com.mx</div>
      </div>
    </footer>

  </div>

</body>
</html>
